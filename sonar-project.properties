sonar.projectKey=DocFaust_my-songbook
sonar.organization=docfaust

sonar.sources=frontend/src,backend/src/main/java
sonar.tests=frontend/src,backend/src/test/java
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.gradle/**,**/backend/build/**

# Frontend tests live under frontend/src/; backend tests live under backend/src/test/java
sonar.test.inclusions=**/__tests__/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/src/test/java/**

sonar.coverage.exclusions=**/__tests__/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,frontend/src/main.jsx,frontend/src/setupTests.js,**/ImportButton.jsx,**/InputArea.jsx,**/SongList.jsx,**/SongEditorLayout.jsx,**/SongDetail.jsx,**/SongEditor/**,**/src/test/java/**

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.eslint.reportPaths=frontend/reports/eslint/eslint-sonar.json

sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
