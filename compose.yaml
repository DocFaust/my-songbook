# Local Compose development credentials only. Not for production.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mysongbook
      POSTGRES_USER: mysongbook
      POSTGRES_PASSWORD: mysongbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysongbook -d mysongbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mysongbook
      SPRING_DATASOURCE_USERNAME: mysongbook
      SPRING_DATASOURCE_PASSWORD: mysongbook
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
