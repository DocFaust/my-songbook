name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Lint ausführen
        run: npm run lint

      - name: Tests ausführen (mit Coverage)
        run: npm run test:ci

      - name: Build ausführen
        run: npm run build

      - name: Test- & Coverage-Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-and-coverage
          path: |
            coverage/
          if-no-files-found: ignore

      - name: Lint für Sonar ausführen
        run: npm run lint:sonar

      - name: Lint-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: reports/eslint/
          if-no-files-found: ignore

      - name: Frontend-Sonar-Eingaben hochladen
        uses: actions/upload-artifact@v7
        with:
          name: frontend-sonar
          path: |
            coverage/lcov.info
            reports/eslint/eslint-sonar.json
          if-no-files-found: error

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Backend testen und bauen
        working-directory: backend
        run: ./gradlew test jacocoTestReport build --no-daemon

      - name: Backend-Sonar-Eingaben hochladen
        uses: actions/upload-artifact@v7
        with:
          name: backend-sonar
          path: |
            backend/build/classes
            backend/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Java 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Frontend-Sonar-Eingaben laden
        uses: actions/download-artifact@v8
        with:
          name: frontend-sonar
          path: .

      - name: Backend-Sonar-Eingaben laden
        uses: actions/download-artifact@v8
        with:
          name: backend-sonar
          path: backend/build

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=DocFaust_my-songbook
            -Dsonar.organization=docfaust

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: General
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      # npm audit – bricht den Build nicht ab, zeigt aber Probleme
      - name: npm audit
        run: |
          mkdir -p reports/npm-audit
          npm audit --audit-level=high --json > reports/npm-audit/npm-audit.json || true

      - name: npm-audit-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: reports/npm-audit/
          if-no-files-found: ignore

      - name: Cache Dependency-Check data
        uses: actions/cache@v6
        with:
          path: dc-data
          key: dc-data-${{ runner.os }}
          restore-keys: |
            dc-data-${{ runner.os }}-

      - name: OWASP Dependency Check
        timeout-minutes: 8
        env:
          NVDAPIKEY: ${{ secrets.NVDAPIKEY }}
        continue-on-error: true
        run: npm run owasp

      - name: OWASP-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check
          path: dependency-check-report/
          if-no-files-found: ignore
